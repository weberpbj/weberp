<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>weberp-bj — Prijava</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:linear-gradient(135deg,#0d1b2a 0%,#1a3a5c 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .card{background:#161b22;border:1px solid #30363d;border-radius:16px;
    padding:40px 36px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .logo{text-align:center;margin-bottom:32px}
  .logo-icon{font-size:48px;display:block;margin-bottom:8px}
  .logo-name{font-size:22px;font-weight:800;color:#e6edf3;letter-spacing:-.5px}
  .logo-sub{font-size:12px;color:#7d8590;margin-top:2px}
  .form-group{margin-bottom:18px}
  label{display:block;font-size:12px;font-weight:600;color:#7d8590;
    text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
  input{width:100%;background:#0d1117;border:1px solid #30363d;border-radius:8px;
    color:#e6edf3;padding:12px 14px;font-size:15px;font-family:inherit;
    outline:none;transition:border-color .15s}
  input:focus{border-color:#58a6ff}
  .btn{width:100%;background:#1f6feb;border:none;border-radius:8px;color:#fff;
    padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
    transition:background .15s;margin-top:8px}
  .btn:hover{background:#388bfd}
  .btn:disabled{background:#21262d;color:#7d8590;cursor:not-allowed}
  .msg{border-radius:8px;padding:12px 14px;font-size:13px;margin-top:14px;display:none}
  .msg.error{background:#2d1b1b;border:1px solid #f8514933;color:#f85149}
  .msg.info{background:#1b2a1b;border:1px solid #3fb95033;color:#3fb950}
  .loading{display:inline-block;width:16px;height:16px;border:2px solid #ffffff44;
    border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;
    margin-right:8px;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ver{text-align:center;font-size:11px;color:#484f58;margin-top:24px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <span class="logo-icon">🚛</span>
    <div class="logo-name">weberp-bj</div>
    <div class="logo-sub">Logistički informacijski sustav</div>
  </div>
  <div class="form-group">
    <label for="inp-user">Korisničko ime</label>
    <input type="text" id="inp-user" name="username"
      autocomplete="username" placeholder="Unesite korisničko ime">
  </div>
  <div class="form-group">
    <label for="inp-pass">Lozinka</label>
    <input type="password" id="inp-pass" name="password"
      autocomplete="current-password" placeholder="Unesite lozinku">
  </div>
  <button class="btn" id="btn-login" onclick="doLogin()">Prijava</button>
  <div class="msg" id="msg"></div>
  <div class="ver">weberp-bj v1.0 · 2026</div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxh6R-agYICMnbGuDcyA4eFU7OKIizFXXuVDg32BI_uzf5wuedqcFxQnTzXWUb4N7Fkmw/exec';

// Provjeri sesiju
try {
  if (sessionStorage.getItem('weberp_token')) {
    window.location.href = 'app.html';
  }
} catch(e) {}

// Enter tipka
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

function showMsg(text, type) {
  var el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
  el.style.display = 'block';
}

function resetBtn() {
  var btn = document.getElementById('btn-login');
  btn.disabled = false;
  btn.innerHTML = 'Prijava';
}

function doLogin() {
  // Čitaj vrijednosti direktno iz DOM-a
  var userEl = document.getElementById('inp-user');
  var passEl = document.getElementById('inp-pass');

  if (!userEl || !passEl) {
    showMsg('Greška: polja nisu pronađena.', 'error');
    return;
  }

  var username = userEl.value;
  var password = passEl.value;

  // Trim samo username
  if (username) username = username.trim();

  if (!username || !password) {
    showMsg('Unesite korisničko ime i lozinku.', 'error');
    return;
  }

  var btn = document.getElementById('btn-login');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading"></span>Prijava...';
  document.getElementById('msg').style.display = 'none';

  showMsg('Spajanje na server...', 'info');

  // Pokušaj 1: fetch s text/plain (zaobilazi CORS preflight)
  fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'login', payload: { username: username, password: password }, token: null })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    handleLoginResult(data);
  })
  .catch(function(err) {
    // Pokušaj 2: JSONP fallback
    console.log('Fetch nije uspio, pokušavam JSONP...', err);
    jsonpLogin(username, password);
  });
}

function handleLoginResult(data) {
  if (data && data.ok) {
    try {
      sessionStorage.setItem('weberp_token', data.token);
      sessionStorage.setItem('weberp_user', JSON.stringify(data.user));
    } catch(e) {}
    showMsg('Prijava uspješna! Učitavanje...', 'info');
    setTimeout(function() {
      window.location.href = 'app.html';
    }, 500);
  } else {
    showMsg((data && data.error) ? data.error : 'Pogrešno korisničko ime ili lozinka.', 'error');
    resetBtn();
  }
}

function jsonpLogin(username, password) {
  var cbName = 'wbcb' + Date.now();
  var script = document.createElement('script');
  var done = false;

  var timer = setTimeout(function() {
    if (done) return;
    done = true;
    cleanup();
    showMsg('Server ne odgovara. Pokušajte ponovo.', 'error');
    resetBtn();
  }, 15000);

  window[cbName] = function(data) {
    if (done) return;
    done = true;
    clearTimeout(timer);
    cleanup();
    handleLoginResult(data);
  };

  function cleanup() {
    try { if (script.parentNode) script.parentNode.removeChild(script); } catch(e) {}
    try { delete window[cbName]; } catch(e) {}
  }

  script.onerror = function() {
    if (done) return;
    done = true;
    clearTimeout(timer);
    cleanup();
    showMsg('Nije moguće spojiti se. Provjerite internet.', 'error');
    resetBtn();
  };

  var params = 'action=login'
    + '&payload=' + encodeURIComponent(JSON.stringify({ username: username, password: password }))
    + '&token='
    + '&callback=' + cbName;

  script.src = API + '?' + params;
  document.body.appendChild(script);
}
</script>
</body>
</html>
