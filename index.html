<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>weberp-bj</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:linear-gradient(135deg,#0d1b2a,#1a3a5c);
  display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.card{background:#161b22;border:1px solid #30363d;border-radius:16px;
  padding:40px 36px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo{text-align:center;margin-bottom:32px}
.logo-icon{font-size:48px;display:block;margin-bottom:8px}
.logo-name{font-size:22px;font-weight:800;color:#e6edf3}
.logo-sub{font-size:12px;color:#7d8590;margin-top:2px}
.fg{margin-bottom:18px}
label{display:block;font-size:12px;font-weight:600;color:#7d8590;
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
input{width:100%;background:#0d1117;border:1px solid #30363d;border-radius:8px;
  color:#e6edf3;padding:12px 14px;font-size:15px;font-family:inherit;outline:none}
input:focus{border-color:#58a6ff}
.btn{width:100%;background:#1f6feb;border:none;border-radius:8px;color:#fff;
  padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px}
.btn:hover{background:#388bfd}
.btn:disabled{background:#21262d;color:#7d8590;cursor:not-allowed}
.msg{border-radius:8px;padding:12px 14px;font-size:13px;margin-top:14px;display:none}
.err{background:#2d1b1b;border:1px solid #f8514944;color:#f85149}
.inf{background:#1b2a1b;border:1px solid #3fb95044;color:#3fb950}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff4;
  border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite;
  margin-right:8px;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.ver{text-align:center;font-size:11px;color:#484f58;margin-top:24px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <span class="logo-icon">🚛</span>
    <div class="logo-name">weberp-bj</div>
    <div class="logo-sub">Logistički informacijski sustav</div>
  </div>
  <div class="fg">
    <label for="u">Korisničko ime</label>
    <input type="text" id="u" autocomplete="username" placeholder="Unesite korisničko ime">
  </div>
  <div class="fg">
    <label for="p">Lozinka</label>
    <input type="password" id="p" autocomplete="current-password" placeholder="Unesite lozinku">
  </div>
  <button class="btn" id="lb" onclick="doLogin()">Prijava</button>
  <div class="msg" id="msg"></div>
  <div class="ver">weberp-bj v2.0 · 2026</div>
</div>
<script>

var _API_URL = 'https://script.google.com/macros/s/AKfycbxh6R-agYICMnbGuDcyA4eFU7OKIizFXXuVDg32BI_uzf5wuedqcFxQnTzXWUb4N7Fkmw/exec';
function _apiCall(action, payload) {
  return new Promise(function(resolve, reject) {
    var token = '';
    try { token = sessionStorage.getItem('weberp_token') || ''; } catch(e) {}
    var cb = 'cb' + Date.now() + Math.random().toString(36).substr(2,5);
    var s = document.createElement('script');
    var done = false;
    var t = setTimeout(function() {
      if(done) return; done=true; clean();
      reject(new Error('Timeout.'));
    }, 20000);
    window[cb] = function(d) {
      if(done) return; done=true; clearTimeout(t); clean();
      if(d && !d.ok && d.error === 'Sesija istekla. Prijavite se ponovo.') {
        try{ sessionStorage.clear(); }catch(e){}
        window.location.href='index.html'; return;
      }
      resolve(d);
    };
    function clean() {
      try{if(s.parentNode)s.parentNode.removeChild(s);}catch(e){}
      try{delete window[cb];}catch(e){}
    }
    s.onerror = function() {
      if(done) return; done=true; clearTimeout(t); clean();
      reject(new Error('Nije moguće spojiti se. Provjerite internet.'));
    };
    s.src = _API_URL
      + '?action=' + encodeURIComponent(action)
      + '&payload=' + encodeURIComponent(JSON.stringify(payload||{}))
      + '&token=' + encodeURIComponent(token)
      + '&callback=' + cb;
    document.body.appendChild(s);
  });
}

// Provjeri sesiju
try { if(sessionStorage.getItem('weberp_token')) window.location.href='app.html'; } catch(e){}
document.addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });

function showMsg(txt, cls) {
  var el=document.getElementById('msg');
  el.textContent=txt; el.className='msg '+cls; el.style.display='block';
}
function doLogin() {
  var u=document.getElementById('u').value.trim();
  var p=document.getElementById('p').value;
  if(!u||!p){ showMsg('Unesite korisničko ime i lozinku.','err'); return; }
  var btn=document.getElementById('lb');
  btn.disabled=true;
  btn.innerHTML='<span class="spin"></span>Prijava...';
  document.getElementById('msg').style.display='none';
  _apiCall('login',{username:u,password:p})
    .then(function(d){
      if(d&&d.ok){
        try{
          sessionStorage.setItem('weberp_token',d.token);
          sessionStorage.setItem('weberp_user',JSON.stringify(d.user));
        }catch(e){}
        showMsg('Prijava uspješna!','inf');
        setTimeout(function(){window.location.href='app.html';},400);
      } else {
        showMsg((d&&d.error)||'Pogrešni podaci.','err');
        btn.disabled=false; btn.innerHTML='Prijava';
      }
    })
    .catch(function(e){
      showMsg(e.message||'Greška veze.','err');
      btn.disabled=false; btn.innerHTML='Prijava';
    });
}
</script>
</body>
</html>
